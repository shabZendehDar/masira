<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0B1F">
    <title>مسیرا — ساخت عادت جدید</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0F0B1F;
            --card: #1A1333;
            --border: #241B4A;
            --purple: #7C5CFF;
            --purple-light: #A855F7;
            --gold: #FBBF24;
            --text: #FFFFFF;
            --text-dim: #A0A0B8;
            --text-muted: #6B6B80;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            padding-bottom: 40px;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes checkPop {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ============================================
           دکمه‌های سه‌بعدی (همون سیستم صفحه اصلی)
           ============================================ */
        .btn-3d {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            color: #FFFFFF;
        }

        .btn-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), transparent);
            border-radius: inherit;
            pointer-events: none;
        }

        .btn-3d::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
            pointer-events: none;
        }

        .btn-3d:hover::after {
            left: 100%;
        }

        .btn-3d:active {
            transform: translateY(3px) scale(0.98);
        }

        .btn-purple {
            background: linear-gradient(180deg, #A855F7 0%, #7C5CFF 100%);
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.35),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                0 6px 20px rgba(124, 92, 255, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-purple:active {
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 3px 10px rgba(124, 92, 255, 0.6);
        }

        /* ===== هدر ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .back-btn:active {
            transform: scale(0.9);
            background: var(--border);
        }

        .header-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
        }

        .header-spacer {
            width: 44px;
        }

        /* ===== پیش‌نمایش ===== */
        .preview {
            text-align: center;
            padding: 20px;
            animation: fadeInUp 0.5s ease;
        }

        .preview-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 16px;
            border-radius: 28px;
            background: linear-gradient(180deg, #A855F7, #7C5CFF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 
                inset 0 3px 0 rgba(255, 255, 255, 0.3),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2),
                0 12px 32px rgba(124, 92, 255, 0.5);
            transition: all 0.3s;
        }

        .preview-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            min-height: 30px;
            transition: all 0.3s;
        }

        .preview-subtitle {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 6px;
        }

        /* ===== بخش‌ها ===== */
        .section {
            padding: 0 20px 24px;
            animation: fadeInUp 0.5s ease;
            animation-fill-mode: both;
        }

        .section:nth-child(1) { animation-delay: 0.1s; }
        .section:nth-child(2) { animation-delay: 0.15s; }
        .section:nth-child(3) { animation-delay: 0.2s; }
        .section:nth-child(4) { animation-delay: 0.25s; }
        .section:nth-child(5) { animation-delay: 0.3s; }

        .section-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-label .dot {
            width: 6px;
            height: 6px;
            background: var(--gold);
            border-radius: 50%;
        }

        /* ===== انتخاب ایموجی ===== */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .emoji-option {
            aspect-ratio: 1;
            border-radius: 14px;
            background: var(--card);
            border: 2px solid var(--border);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.05),
                0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .emoji-option:active {
            transform: scale(0.9);
        }

        .emoji-option.active {
            border-color: var(--purple-light);
            background: rgba(168, 85, 247, 0.15);
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                0 0 20px rgba(168, 85, 247, 0.5);
            transform: scale(1.05);
        }

        /* ===== ورودی متن ===== */
        .input-field {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            background: var(--card);
            border: 2px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .input-field:focus {
            border-color: var(--purple-light);
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.2),
                0 0 20px rgba(168, 85, 247, 0.3);
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        /* ===== انتخاب‌های چندگانه ===== */
        .options-row {
            display: grid;
            gap: 8px;
        }

        .options-row.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .options-row.cols-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .option-btn {
            padding: 14px 8px;
            border-radius: 14px;
            background: var(--card);
            border: 2px solid var(--border);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.05),
                0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .option-btn.active {
            border-color: var(--purple-light);
            background: rgba(168, 85, 247, 0.15);
            color: var(--purple-light);
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                0 0 20px rgba(168, 85, 247, 0.4);
        }

        .option-btn .option-emoji {
            font-size: 18px;
        }

        .option-btn .option-label {
            font-size: 12px;
            font-weight: 700;
        }

        /* ===== دکمه ذخیره ===== */
        .save-section {
            padding: 20px;
            position: sticky;
            bottom: 0;
            background: linear-gradient(180deg, transparent, var(--bg) 30%);
            margin-top: 20px;
        }

        .save-btn {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            border-radius: 18px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            border: 1px solid var(--gold);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(251, 191, 36, 0.3);
            z-index: 200;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== انیمیشن موفقیت ===== */
        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 11, 31, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .success-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(180deg, #FCD34D, #FBBF24);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 24px;
            animation: checkPop 0.6s ease;
            box-shadow: 
                inset 0 4px 0 rgba(255, 255, 255, 0.4),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2),
                0 12px 40px rgba(251, 191, 36, 0.6);
        }

        .success-text {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
        }

        .success-subtext {
            font-size: 14px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- هدر -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="header-title">ساخت عادت جدید</div>
            <div class="header-spacer"></div>
        </div>

        <!-- پیش‌نمایش -->
        <div class="preview">
            <div class="preview-icon" id="previewIcon">📖</div>
            <div class="preview-title" id="previewTitle">عادت جدید</div>
            <div class="preview-subtitle" id="previewSubtitle">۱۵ دقیقه • هر روز</div>
        </div>

        <!-- آیکون -->
        <div class="section">
            <div class="section-label">
                <span class="dot"></span>
                آیکون عادت
            </div>
            <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <!-- نام -->
        <div class="section">
            <div class="section-label">
                <span class="dot"></span>
                نام عادت
            </div>
            <input 
                type="text" 
                class="input-field" 
                id="habitName" 
                placeholder="مثلاً: مطالعه ریاضی"
                maxlength="30"
                oninput="updatePreview()"
            >
        </div>

        <!-- مدت -->
        <div class="section">
            <div class="section-label">
                <span class="dot"></span>
                مدت زمان
            </div>
            <div class="options-row cols-4" id="durationOptions"></div>
        </div>

        <!-- تکرار -->
        <div class="section">
            <div class="section-label">
                <span class="dot"></span>
                تکرار
            </div>
            <div class="options-row cols-3" id="repeatOptions"></div>
        </div>

        <!-- سختی -->
        <div class="section">
            <div class="section-label">
                <span class="dot"></span>
                سختی
            </div>
            <div class="options-row cols-3" id="difficultyOptions"></div>
        </div>

        <!-- دکمه ذخیره -->
        <div class="save-section">
            <button class="btn-3d btn-purple save-btn" onclick="saveHabit()">
                💾 ذخیره عادت
            </button>
        </div>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- انیمیشن موفقیت -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-icon">✓</div>
        <div class="success-text">عادت ساخته شد!</div>
        <div class="success-subtext" id="successSubtext">بریم سراغش</div>
    </div>

    <script>
        // ===== داده‌ها =====
        const emojis = ['📖', '🏃', '🧘', '🍎', '🌙', '💪', '🎯', '✍️', '🎨', '🎵', '💧', '🌱'];
        const durations = [
            { label: '۵ دقیقه', value: '۵ دقیقه' },
            { label: '۱۵ دقیقه', value: '۱۵ دقیقه' },
            { label: '۳۰ دقیقه', value: '۳۰ دقیقه' },
            { label: '۱ ساعت', value: '۱ ساعت' }
        ];
        const repeats = [
            { label: 'هر روز', emoji: '☀️', value: 'هر روز' },
            { label: 'هفتگی', emoji: '📅', value: 'هفتگی' },
            { label: 'ماهانه', emoji: '🗓️', value: 'ماهانه' }
        ];
        const difficulties = [
            { label: 'آسان', emoji: '⭐', value: 'آسان' },
            { label: 'متوسط', emoji: '⭐⭐', value: 'متوسط' },
            { label: 'سخت', emoji: '⭐⭐⭐', value: 'سخت' }
        ];

        // ===== وضعیت =====
        let newHabit = {
            emoji: '📖',
            name: '',
            duration: '۱۵ دقیقه',
            repeat: 'هر روز',
            difficulty: 'آسان'
        };

        // ===== ساخت ایموجی‌ها =====
        function renderEmojis() {
            const grid = document.getElementById('emojiGrid');
            grid.innerHTML = '';
            emojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'emoji-option' + (emoji === newHabit.emoji ? ' active' : '');
                btn.textContent = emoji;
                btn.onclick = () => selectEmoji(emoji);
                grid.appendChild(btn);
            });
        }

        // ===== ساخت مدت‌ها =====
        function renderDurations() {
            const container = document.getElementById('durationOptions');
            container.innerHTML = '';
            durations.forEach(d => {
                const btn = document.createElement('button');
                btn.className = 'option-btn' + (d.value === newHabit.duration ? ' active' : '');
                btn.innerHTML = `<span class="option-label">${d.label}</span>`;
                btn.onclick = () => selectDuration(d.value);
                container.appendChild(btn);
            });
        }

        // ===== ساخت تکرارها =====
        function renderRepeats() {
            const container = document.getElementById('repeatOptions');
            container.innerHTML = '';
            repeats.forEach(r => {
                const btn = document.createElement('button');
                btn.className = 'option-btn' + (r.value === newHabit.repeat ? ' active' : '');
                btn.innerHTML = `
                    <span class="option-emoji">${r.emoji}</span>
                    <span class="option-label">${r.label}</span>
                `;
                btn.onclick = () => selectRepeat(r.value);
                container.appendChild(btn);
            });
        }

        // ===== ساخت سختی‌ها =====
        function renderDifficulties() {
            const container = document.getElementById('difficultyOptions');
            container.innerHTML = '';
            difficulties.forEach(d => {
                const btn = document.createElement('button');
                btn.className = 'option-btn' + (d.value === newHabit.difficulty ? ' active' : '');
                btn.innerHTML = `
                    <span class="option-emoji">${d.emoji}</span>
                    <span class="option-label">${d.label}</span>
                `;
                btn.onclick = () => selectDifficulty(d.value);
                container.appendChild(btn);
            });
        }

        // ===== انتخاب‌ها =====
        function selectEmoji(emoji) {
            newHabit.emoji = emoji;
            renderEmojis();
            updatePreview();
        }

        function selectDuration(value) {
            newHabit.duration = value;
            renderDurations();
            updatePreview();
        }

        function selectRepeat(value) {
            newHabit.repeat = value;
            renderRepeats();
            updatePreview();
        }

        function selectDifficulty(value) {
            newHabit.difficulty = value;
            renderDifficulties();
        }

        // ===== به‌روزرسانی پیش‌نمایش =====
        function updatePreview() {
            newHabit.name = document.getElementById('habitName').value.trim();
            document.getElementById('previewIcon').textContent = newHabit.emoji;
            document.getElementById('previewTitle').textContent =
                newHabit.name || 'عادت جدید';
            document.getElementById('previewSubtitle').textContent =
                `${newHabit.duration} • ${newHabit.repeat}`;
        }

        // ===== ذخیره =====
        function saveHabit() {
            const name = document.getElementById('habitName').value.trim();
            if (!name) {
                showToast('⚠️ نام عادت رو وارد کن');
                document.getElementById('habitName').focus();
                return;
            }

            // خوندن عادت‌های قبلی
            let habits = [];
            try {
                const saved = localStorage.getItem('masira_state');
                if (saved) {
                    const data = JSON.parse(saved);
                    habits = data.habits || [];
                }
            } catch (e) {}

            // اضافه کردن عادت جدید
            habits.push({
                id: Date.now(),
                emoji: newHabit.emoji,
                label: name,
                time: newHabit.duration,
                repeat: newHabit.repeat,
                difficulty: newHabit.difficulty
            });

            // ذخیره
            localStorage.setItem('masira_state', JSON.stringify({
                habits: habits,
                completed: {},
                currentQuote: 0,
                date: getTodayKey()
            }));

            // نمایش موفقیت
            document.getElementById('successSubtext').textContent =
                `«${name}» به مسیرت اضافه شد`;
            document.getElementById('successOverlay').classList.add('show');

            // بازگشت به صفحه اصلی بعد از ۲ ثانیه
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }

        // ===== بازگشت =====
        function goBack() {
            window.location.href = 'index.html';
        }

        // ===== Toast =====
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ===== ابزار =====
        function getTodayKey() {
            const now = new Date();
            return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
        }

        // ===== راه‌اندازی =====
        window.addEventListener('load', () => {
            renderEmojis();
            renderDurations();
            renderRepeats();
            renderDifficulties();
        });
    </script>
</body>
</html>
