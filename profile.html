<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFF8F5" id="themeColor">
    <title>مسیرا — حساب من</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        /* ============================================
           تم روز
           ============================================ */
        :root {
            --bg: #FFF8F5;
            --bg-gradient-1: rgba(255, 107, 157, 0.15);
            --bg-gradient-2: rgba(78, 205, 196, 0.12);
            --bg-gradient-3: rgba(255, 217, 61, 0.1);
            --card: #FFFFFF;
            --card-shadow: rgba(255, 107, 157, 0.1);
            --border: #FFE8EE;
            --text: #3D2C3A;
            --text-dim: #9B8A96;
            --text-muted: #B8A5B0;
            --pink: #FF6B9D;
            --mint: #4ECDC4;
            --yellow: #FFD93D;
            --lilac: #C8A2FF;
            --red: #EF4444;
            --grad-main: linear-gradient(135deg, #FF6B9D 0%, #C8A2FF 100%);
            --grad-mint: linear-gradient(135deg, #4ECDC4 0%, #FFD93D 100%);
            --grad-yellow: linear-gradient(135deg, #FFD93D 0%, #FF6B9D 100%);
            --overlay: rgba(255, 255, 255, 0.6);
        }

        /* ============================================
           تم شب
           ============================================ */
        [data-theme="dark"] {
            --bg: #1A1520;
            --bg-gradient-1: rgba(255, 143, 179, 0.15);
            --bg-gradient-2: rgba(95, 217, 208, 0.1);
            --bg-gradient-3: rgba(255, 224, 102, 0.08);
            --card: #252030;
            --card-shadow: rgba(0, 0, 0, 0.4);
            --border: #352E42;
            --text: #F5EEF8;
            --text-dim: #B8A8C0;
            --text-muted: #8A7A95;
            --pink: #FF8FB3;
            --mint: #5FD9D0;
            --yellow: #FFE066;
            --lilac: #D4B5FF;
            --red: #FF6B6B;
            --grad-main: linear-gradient(135deg, #FF8FB3 0%, #D4B5FF 100%);
            --grad-mint: linear-gradient(135deg, #5FD9D0 0%, #FFE066 100%);
            --grad-yellow: linear-gradient(135deg, #FFE066 0%, #FF8FB3 100%);
            --overlay: rgba(37, 32, 48, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body {
            display: flex;
            justify-content: center;
            background: 
                radial-gradient(circle at 15% 10%, var(--bg-gradient-1), transparent 40%),
                radial-gradient(circle at 85% 20%, var(--bg-gradient-2), transparent 40%),
                radial-gradient(circle at 50% 90%, var(--bg-gradient-3), transparent 40%),
                var(--bg);
            background-attachment: fixed;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            position: relative;
            padding-bottom: 120px;
        }

        /* ============================================
           انیمیشن‌ها
           ============================================ */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 16px rgba(255, 217, 61, 0.3); }
            50% { box-shadow: 0 0 24px rgba(255, 217, 61, 0.6); }
        }

        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .fade-in {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .fade-in:nth-child(1) { animation-delay: 0.05s; }
        .fade-in:nth-child(2) { animation-delay: 0.1s; }
        .fade-in:nth-child(3) { animation-delay: 0.15s; }
        .fade-in:nth-child(4) { animation-delay: 0.2s; }
        .fade-in:nth-child(5) { animation-delay: 0.25s; }

        /* ============================================
           هدر
           ============================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
            transition: background 0.4s ease;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .back-btn:active {
            transform: scale(0.9);
            background: var(--border);
        }

        .header-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--text);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s, transform 0.2s;
        }

        .icon-btn:active {
            color: var(--pink);
            transform: scale(0.85);
        }

        #themeBtn:active {
            transform: rotate(180deg) scale(0.9);
        }

        /* ============================================
           هدر پروفایل
           ============================================ */
        .profile-header {
            padding: 20px 20px 24px;
            text-align: center;
            position: relative;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.15), transparent 70%);
            pointer-events: none;
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--grad-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            font-weight: 900;
            color: #FFFFFF;
            margin: 0 auto 16px;
            position: relative;
            box-shadow: 
                inset 0 4px 0 rgba(255, 255, 255, 0.4),
                inset 0 -4px 0 rgba(0, 0, 0, 0.1),
                0 12px 32px rgba(255, 107, 157, 0.4);
            animation: float 4s infinite;
        }

        .profile-avatar::after {
            content: '';
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 20px;
            height: 20px;
            background: var(--mint);
            border-radius: 50%;
            border: 3px solid var(--bg);
            box-shadow: 0 0 12px rgba(78, 205, 196, 0.6);
        }

        .profile-name {
            font-size: 26px;
            font-weight: 900;
            background: var(--grad-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .profile-subtitle {
            font-size: 14px;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .profile-level {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--grad-mint);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 800;
            color: #FFFFFF;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.4),
                0 4px 12px rgba(78, 205, 196, 0.4);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* ============================================
           بخش‌ها
           ============================================ */
        .section {
            padding: 0 20px 24px;
            animation: fadeInUp 0.5s ease;
            animation-fill-mode: both;
        }

        .section:nth-child(2) { animation-delay: 0.1s; }
        .section:nth-child(3) { animation-delay: 0.2s; }
        .section:nth-child(4) { animation-delay: 0.3s; }
        .section:nth-child(5) { animation-delay: 0.4s; }

        .section-label {
            font-size: 15px;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--grad-main);
            box-shadow: 0 0 8px rgba(255, 107, 157, 0.5);
        }

        /* ============================================
           آمار
           ============================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px var(--card-shadow);
            transition: background 0.4s ease, border 0.4s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 20%, rgba(255, 107, 157, 0.08), transparent 50%);
            pointer-events: none;
        }

        .stat-emoji {
            font-size: 28px;
            margin-bottom: 8px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 900;
            background: var(--grad-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            position: relative;
            z-index: 1;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        /* ============================================
           نشان‌ها
           ============================================ */
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .badge {
            aspect-ratio: 1;
            border-radius: 18px;
            background: var(--card);
            border: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .badge:active {
            transform: scale(0.95);
        }

        .badge.unlocked {
            border-color: var(--pink);
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.1), rgba(200, 162, 255, 0.1));
            box-shadow: 
                0 4px 12px rgba(255, 107, 157, 0.2),
                inset 0 2px 0 rgba(255, 255, 255, 0.4);
        }

        .badge.unlocked::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            background-size: 200% auto;
            animation: shine 3s infinite linear;
            pointer-events: none;
        }

        .badge.locked {
            opacity: 0.4;
        }

        .badge-emoji {
            font-size: 28px;
            position: relative;
            z-index: 1;
        }

        .badge-label {
            font-size: 10px;
            color: var(--text-dim);
            font-weight: 800;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .badge.unlocked .badge-label {
            color: var(--pink);
        }

        /* ============================================
           تنظیمات
           ============================================ */
        .settings-list {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 16px var(--card-shadow);
            transition: background 0.4s ease, border 0.4s ease;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--border);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-item:active {
            background: var(--border);
        }

        .setting-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .setting-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.4),
                0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .setting-icon.pink { background: var(--grad-main); }
        .setting-icon.mint { background: var(--grad-mint); }
        .setting-icon.yellow { background: var(--grad-yellow); }
        .setting-icon.lilac { background: linear-gradient(135deg, #C8A2FF, #A8D8FF); }
        .setting-icon.blue { background: linear-gradient(135deg, #5DADE2, #A8E6CF); }

        .setting-label {
            font-size: 14px;
            font-weight: 800;
            color: var(--text);
        }

        .setting-value {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 700;
        }

        .setting-arrow {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* ============================================
           دکمه خروج
           ============================================ */
        .logout-section {
            padding: 0 20px;
        }

        .logout-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: var(--red);
            font-family: inherit;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:active {
            transform: scale(0.97);
            background: rgba(239, 68, 68, 0.2);
        }

        /* ============================================
           نوار پایین
           ============================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: var(--overlay);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 14px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(255, 107, 157, 0.08);
            transition: background 0.4s ease, border 0.4s ease;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            flex: 1;
            position: relative;
            padding: 4px 0;
            transition: color 0.3s;
            font-weight: 700;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            transition: transform 0.2s;
        }

        .nav-item:active .nav-icon {
            transform: scale(0.9);
        }

        .nav-item.active {
            color: var(--pink);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            width: 24px;
            height: 3px;
            background: var(--grad-main);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 107, 157, 0.5);
        }

        .nav-plus {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--grad-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #FFFFFF;
            font-weight: 300;
            margin-top: -22px;
            border: 4px solid var(--bg);
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 3px 0 rgba(255, 255, 255, 0.5),
                inset 0 -4px 0 rgba(0, 0, 0, 0.15),
                0 8px 24px rgba(255, 107, 157, 0.5),
                0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1), border 0.4s ease;
            flex: 0 0 auto;
        }

        .nav-plus::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 20%;
            right: 20%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .nav-plus:active {
            transform: translateY(4px) scale(0.95);
        }

        /* ============================================
           Toast
           ============================================ */
        .toast {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            border: 1.5px solid var(--pink);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 
                0 8px 24px rgba(255, 107, 157, 0.3),
                0 4px 12px rgba(0, 0, 0, 0.08);
            z-index: 200;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- هدر -->
        <div class="header">
            <button class="back-btn" onclick="goHome()">←</button>
            <div class="header-title">حساب من</div>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>

        <!-- هدر پروفایل -->
        <div class="profile-header fade-in">
            <div class="profile-avatar">ا</div>
            <div class="profile-name">امیر</div>
            <div class="profile-subtitle">کنکوری ۱۴۰۴</div>
            <div class="profile-level">
                🏆 سطح ۵ — مسافر
            </div>
        </div>

        <!-- آمار -->
        <div class="section fade-in">
            <div class="section-label">
                <span class="dot"></span>
                📊 آمار من
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-emoji">🔥</span>
                    <div class="stat-value" id="statStreak">۷</div>
                    <div class="stat-label">روز پیوسته</div>
                </div>
                <div class="stat-card">
                    <span class="stat-emoji">✅</span>
                    <div class="stat-value" id="statHabits">۰</div>
                    <div class="stat-label">عادت امروز</div>
                </div>
                <div class="stat-card">
                    <span class="stat-emoji">💎</span>
                    <div class="stat-value">۱۲</div>
                    <div class="stat-label">گوهر</div>
                </div>
            </div>
        </div>

        <!-- نشان‌ها -->
        <div class="section fade-in">
            <div class="section-label">
                <span class="dot"></span>
                🏆 نشان‌های من
            </div>
            <div class="badges-grid" id="badgesGrid"></div>
        </div>

        <!-- تنظیمات -->
        <div class="section fade-in">
            <div class="section-label">
                <span class="dot"></span>
                ⚙️ تنظیمات
            </div>
            <div class="settings-list">
                <div class="setting-item" onclick="showToast('🔔 اعلان‌ها')">
                    <div class="setting-right">
                        <div class="setting-icon pink">🔔</div>
                        <div class="setting-label">اعلان‌ها</div>
                    </div>
                    <span class="setting-arrow">←</span>
                </div>
                <div class="setting-item" onclick="toggleTheme()">
                    <div class="setting-right">
                        <div class="setting-icon lilac" id="themeSettingIcon">🌙</div>
                        <div class="setting-label">حالت شب</div>
                    </div>
                    <span class="setting-value" id="themeValue">خاموش</span>
                </div>
                <div class="setting-item" onclick="showToast('📅 تاریخ')">
                    <div class="setting-right">
                        <div class="setting-icon mint">📅</div>
                        <div class="setting-label">تاریخ</div>
                    </div>
                    <span class="setting-value">شمسی</span>
                </div>
                <div class="setting-item" onclick="showToast('🌐 زبان')">
                    <div class="setting-right">
                        <div class="setting-icon yellow">🌐</div>
                        <div class="setting-label">زبان</div>
                    </div>
                    <span class="setting-value">فارسی</span>
                </div>
                <div class="setting-item" onclick="showToast('ℹ️ درباره مسیرا')">
                    <div class="setting-right">
                        <div class="setting-icon blue">ℹ️</div>
                        <div class="setting-label">درباره ما</div>
                    </div>
                    <span class="setting-arrow">←</span>
                </div>
            </div>
        </div>

        <!-- خروج -->
        <div class="logout-section fade-in">
            <button class="logout-btn" onclick="logout()">
                🚪 خروج از حساب
            </button>
        </div>

    </div>

    <!-- نوار پایین -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="goHome()">
            <span class="nav-icon">🏠</span>
            <span>خانه</span>
        </button>
        <button class="nav-item" onclick="goPath()">
            <span class="nav-icon">🎯</span>
            <span>مسیر</span>
        </button>
        <button class="nav-plus" onclick="goAdd()">+</button>
        <button class="nav-item" onclick="showToast('🌱 عادت روزانه')">
            <span class="nav-icon">🌱</span>
            <span>عادت روزانه</span>
        </button>
        <button class="nav-item active">
            <span class="nav-icon">👤</span>
            <span>حساب</span>
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== نشان‌ها =====
        const allBadges = [
            { emoji: '🌱', label: 'شروع', unlocked: true },
            { emoji: '🔥', label: '۷ روز', unlocked: true },
            { emoji: '⚡', label: 'انرژی', unlocked: true },
            { emoji: '📖', label: 'مطالعه', unlocked: true },
            { emoji: '🏃', label: 'ورزش', unlocked: false },
            { emoji: '💎', label: 'گوهر', unlocked: false },
            { emoji: '🏆', label: 'قهرمان', unlocked: false },
            { emoji: '👑', label: 'پادشاه', unlocked: false }
        ];

        // ===== تم =====
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('masira_theme', newTheme);
            updateThemeUI(newTheme);
        }

        function loadTheme() {
            const saved = localStorage.getItem('masira_theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeUI(saved);
        }

        function updateThemeUI(theme) {
            const btn = document.getElementById('themeBtn');
            const icon = document.getElementById('themeSettingIcon');
            const value = document.getElementById('themeValue');
            const meta = document.getElementById('themeColor');

            if (theme === 'dark') {
                btn.textContent = '☀️';
                if (icon) icon.textContent = '☀️';
                if (value) value.textContent = 'روشن';
                meta.setAttribute('content', '#1A1520');
            } else {
                btn.textContent = '🌙';
                if (icon) icon.textContent = '🌙';
                if (value) value.textContent = 'خاموش';
                meta.setAttribute('content', '#FFF8F5');
            }
        }

        // ===== رندر نشان‌ها =====
        function renderBadges() {
            const grid = document.getElementById('badgesGrid');
            grid.innerHTML = '';
            allBadges.forEach(badge => {
                const el = document.createElement('div');
                el.className = 'badge ' + (badge.unlocked ? 'unlocked' : 'locked');
                el.innerHTML = `
                    <div class="badge-emoji">${badge.emoji}</div>
                    <div class="badge-label">${badge.label}</div>
                `;
                el.onclick = () => {
                    showToast(badge.unlocked ? `🏆 ${badge.label} — گرفته شد!` : `🔒 ${badge.label} — قفل`);
                };
                grid.appendChild(el);
            });
        }

        // ===== بارگذاری آمار =====
        function loadStats() {
            try {
                const saved = localStorage.getItem('masira_state');
                if (saved) {
                    const data = JSON.parse(saved);
                    const completed = Object.keys(data.completed || {}).length;
                    document.getElementById('statHabits').textContent = toPersian(completed);
                }
            } catch (e) {}
        }

        // ===== تبدیل عدد =====
        function toPersian(num) {
            const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            return num.toString().replace(/\d/g, d => persianDigits[d]);
        }

        // ===== ناوبری =====
        function goHome() { window.location.href = 'index.html'; }
        function goPath() { window.location.href = 'path.html'; }
        function goAdd() { window.location.href = 'add-habit.html'; }

        function logout() {
            if (confirm('از حساب خارج می‌شی؟')) {
                showToast('👋 به امید دیدار!');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        }

        // ===== Toast =====
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ===== راه‌اندازی =====
        window.addEventListener('load', () => {
            loadTheme();
            renderBadges();
            loadStats();
        });
    </script>
</body>
</html>
