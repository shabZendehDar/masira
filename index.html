<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0B1F">
    <title>مسیرا</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0F0B1F;
            --card: #1A1333;
            --border: #241B4A;
            --purple: #7C5CFF;
            --purple-light: #A855F7;
            --gold: #FBBF24;
            --text: #FFFFFF;
            --text-dim: #A0A0B8;
            --text-muted: #6B6B80;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            padding-bottom: 120px;
        }

        /* ===== انیمیشن‌ها ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        @keyframes checkPop {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .fade-in {
            animation: fadeInUp 0.5s ease forwards;
        }

        /* ============================================
           سیستم دکمه سه‌بعدی — استفاده همه‌جا
           ============================================ */
        .btn-3d {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            color: #FFFFFF;
        }

        .btn-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), transparent);
            border-radius: inherit;
            pointer-events: none;
        }

        .btn-3d::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
            pointer-events: none;
        }

        .btn-3d:hover::after {
            left: 100%;
        }

        .btn-3d:active {
            transform: translateY(3px) scale(0.98);
        }

        /* دکمه بنفش (اصلی) */
        .btn-purple {
            background: linear-gradient(180deg, #A855F7 0%, #7C5CFF 100%);
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.35),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                0 6px 20px rgba(124, 92, 255, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-purple:active {
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 3px 10px rgba(124, 92, 255, 0.6),
                0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* دکمه طلایی (accent) */
        .btn-gold {
            background: linear-gradient(180deg, #FCD34D 0%, #FBBF24 100%);
            color: #0F0B1F;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.5),
                inset 0 -3px 0 rgba(0, 0, 0, 0.15),
                0 6px 20px rgba(251, 191, 36, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-gold:active {
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.15),
                0 3px 10px rgba(251, 191, 36, 0.6);
        }

        /* ===== نوار بالا ===== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #A855F7, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #A855F7, #3B82F6);
            border-radius: 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(124, 92, 255, 0.4);
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            top: 6px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--gold);
        }

        .logo-icon::after {
            content: '';
            width: 14px;
            height: 14px;
            background: #FFFFFF;
            border-radius: 50%;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #A855F7, #3B82F6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            position: relative;
            border: 2px solid var(--gold);
            color: #FFFFFF;
        }

        .avatar::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: #22D97F;
            border-radius: 50%;
            border: 2px solid var(--bg);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 22px;
            cursor: pointer;
            position: relative;
            padding: 4px;
            transition: color 0.2s;
        }

        .icon-btn:active {
            color: var(--purple-light);
            transform: scale(0.9);
        }

        .icon-btn .dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            border: 1.5px solid var(--bg);
            animation: pulse 2s infinite;
        }

        /* ===== گرتینگ ===== */
        .greeting {
            padding: 8px 20px 20px;
            text-align: right;
        }

        .greeting .hello {
            font-size: 15px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .greeting .question {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.4;
        }

        /* ===== کارت مسیر اصلی ===== */
        .main-card {
            margin: 0 16px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at top right, rgba(124, 92, 255, 0.08), transparent 60%);
            pointer-events: none;
        }

        .main-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
            gap: 12px;
        }

        .main-card-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .main-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(180deg, #A855F7, #7C5CFF);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2),
                0 4px 12px rgba(124, 92, 255, 0.3);
        }

        .main-label {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .main-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .target-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 11px;
            color: var(--gold);
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            margin: 16px 0 8px;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(180deg, #A855F7, #7C5CFF);
            border-radius: 5px;
            width: 43%;
            position: relative;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--gold));
            border-radius: 5px;
            box-shadow: 0 0 12px var(--gold);
        }

        .progress-text {
            text-align: left;
            font-size: 16px;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .next-step {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .next-step-icon {
            width: 36px;
            height: 36px;
            background: rgba(124, 92, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .next-step-text {
            flex: 1;
            min-width: 0;
        }

        .next-step-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .next-step-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow-icon {
            color: var(--text-dim);
            font-size: 18px;
            flex-shrink: 0;
        }

        /* ===== CTA اصلی ===== */
        .cta-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border-radius: 16px;
            position: relative;
            z-index: 1;
        }

        /* ===== تایم‌لاین امروز ===== */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 16px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .section-counter {
            font-size: 14px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-counter .dot {
            width: 6px;
            height: 6px;
            background: var(--gold);
            border-radius: 50%;
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 8px 32px;
            position: relative;
        }

        .timeline-line {
            position: absolute;
            top: 30px;
            right: 50px;
            left: 50px;
            height: 3px;
            background: var(--border);
            z-index: 0;
            border-radius: 2px;
        }

        .timeline-line-fill {
            height: 100%;
            background: linear-gradient(90deg, #A855F7, var(--gold));
            width: 45%;
            border-radius: 2px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 1;
            flex: 1;
            min-width: 0;
        }

        /* دایره‌های تایم‌لاین — سه‌بعدی */
        .step-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(180deg, #2A1F4A, #1A1333);
            border: 2px solid var(--border);
            color: var(--text-muted);
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.3),
                0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .step-circle:active {
            transform: scale(0.95);
        }

        .step-circle.done {
            background: linear-gradient(180deg, #A855F7, #7C5CFF);
            border-color: #A855F7;
            color: #FFFFFF;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2),
                0 4px 16px rgba(124, 92, 255, 0.5);
        }

        .step-circle.done::after {
            content: '✓';
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 22px;
            height: 22px;
            background: linear-gradient(180deg, #FCD34D, #FBBF24);
            color: var(--bg);
            border-radius: 50%;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg);
            animation: checkPop 0.4s ease;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.5);
        }

        .step-circle.current {
            background: linear-gradient(180deg, #2A1F4A, #1A1333);
            border: 3px solid var(--gold);
            color: var(--gold);
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.3),
                0 0 24px rgba(251, 191, 36, 0.5);
            animation: pulse 2s infinite;
        }

        .step-label {
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            white-space: nowrap;
            transition: color 0.3s;
        }

        .step-label.active {
            color: var(--text);
            font-weight: 700;
        }

        .step-time {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
        }

        .step-time.gold {
            color: var(--gold);
            font-weight: 600;
        }

        /* ===== نقل قول ===== */
        .quote {
            margin: 0 20px 24px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.06), rgba(59, 130, 246, 0.06));
            border: 1px solid var(--border);
            border-radius: 16px;
            text-align: right;
            position: relative;
            overflow: hidden;
        }

        .quote::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .quote-text {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.9;
            position: relative;
            z-index: 1;
        }

        .quote-sparkle {
            position: absolute;
            top: 12px;
            left: 12px;
            color: var(--gold);
            font-size: 16px;
            animation: sparkle 2s infinite;
        }

        /* ===== نوار پایین ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(26, 19, 51, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 14px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            flex: 1;
            position: relative;
            padding: 4px 0;
            transition: color 0.3s;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            transition: transform 0.2s;
        }

        .nav-item:active .nav-icon {
            transform: scale(0.9);
        }

        .nav-item.active {
            color: var(--purple-light);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            width: 20px;
            height: 3px;
            background: var(--gold);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--gold);
        }

        /* ===== دکمه + (سه‌بعدی) ===== */
        .nav-plus {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(180deg, #A855F7 0%, #7C5CFF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #FFFFFF;
            font-weight: 300;
            margin-top: -20px;
            border: 4px solid var(--bg);
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 3px 0 rgba(255, 255, 255, 0.4),
                inset 0 -4px 0 rgba(0, 0, 0, 0.25),
                0 8px 24px rgba(124, 92, 255, 0.6),
                0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 0 0 auto;
        }

        .nav-plus::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 20%;
            right: 20%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .nav-plus:active {
            transform: translateY(4px) scale(0.95);
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2),
                0 4px 12px rgba(124, 92, 255, 0.7);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            border: 1px solid var(--gold);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(251, 191, 36, 0.3);
            z-index: 200;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- نوار بالا -->
        <div class="topbar">
            <div class="topbar-right">
                <span class="logo-text">مسیرا</span>
                <div class="logo-icon"></div>
            </div>
            <div class="topbar-left">
                <div class="avatar">ا</div>
                <button class="icon-btn" onclick="showToast('🔔 نوتیفیکیشن‌ها')">
                    🔔
                    <span class="dot"></span>
                </button>
                <button class="icon-btn" onclick="showToast('🔍 جستجو')">🔍</button>
            </div>
        </div>

        <!-- گرتینگ -->
        <div class="greeting fade-in">
            <div class="hello" id="greetingHello">سلام امیر 👋</div>
            <div class="question">امروز قدم بعدیت چیه؟</div>
        </div>

        <!-- کارت مسیر اصلی -->
        <div class="main-card fade-in">
            <div class="main-card-header">
                <div class="main-card-header-right">
                    <div class="main-icon">🎯</div>
                    <div style="min-width: 0; flex: 1;">
                        <div class="main-label">مسیر اصلی من</div>
                        <div class="main-title">بهترین نسخه از خودم</div>
                    </div>
                </div>
                <div class="target-chip">
                    🎓 قبولی دانشگاه تهران
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">۴۳٪</div>

            <div class="next-step">
                <div class="next-step-icon">📅</div>
                <div class="next-step-text">
                    <div class="next-step-label">قدم بعدی:</div>
                    <div class="next-step-value" id="nextStepValue">۱۵ دقیقه مطالعه</div>
                </div>
                <span class="arrow-icon">←</span>
            </div>

            <button class="btn-3d btn-purple cta-btn" onclick="continuePath()">
                ادامه مسیر
                <span>←</span>
            </button>
        </div>

        <!-- تایم‌لاین امروز -->
        <div class="section-header fade-in">
            <div class="section-title">مسیر امروز</div>
            <div class="section-counter" id="sectionCounter">
                ۰ از ۵
                <span class="dot"></span>
            </div>
        </div>

        <div class="timeline fade-in" id="timeline">
            <div class="timeline-line">
                <div class="timeline-line-fill" id="timelineFill"></div>
            </div>
        </div>

        <!-- نقل قول -->
        <div class="quote fade-in">
            <div class="quote-sparkle">✦</div>
            <div class="quote-text" id="quoteText">
                هر قدم کوچک،<br>
                تو را به رؤیاهایت نزدیک‌تر می‌کند.
            </div>
        </div>

    </div>

    <!-- نوار پایین -->
    <div class="bottom-nav">
        <button class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>خانه</span>
        </button>
        <button class="nav-item" onclick="showToast('🎯 مسیر')">
            <span class="nav-icon">🎯</span>
            <span>مسیر</span>
        </button>
        <button class="nav-plus" onclick="addNew()">+</button>
        <button class="nav-item" onclick="showToast('🌱 عادت روزانه')">
            <span class="nav-icon">🌱</span>
            <span>عادت روزانه</span>
        </button>
        <button class="nav-item" onclick="showToast('👤 حساب')">
            <span class="nav-icon">👤</span>
            <span>حساب</span>
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const defaultHabits = [
            { id: 1, emoji: '🧘', label: 'مدیتیشن', time: '۱۰ دقیقه' },
            { id: 2, emoji: '🏃', label: 'ورزش', time: '۳۰ دقیقه' },
            { id: 3, emoji: '📖', label: 'مطالعه', time: '۱۵ دقیقه' },
            { id: 4, emoji: '🍎', label: 'تغذیه', time: '۲۰ دقیقه' },
            { id: 5, emoji: '🌙', label: 'خواب', time: '۸ ساعت' }
        ];

        const quotes = [
            'هر قدم کوچک،\nتو را به رؤیاهایت نزدیک‌تر می‌کند.',
            'موفقیت، حاصل کارهای کوچک و مداوم است.',
            'امروز بهترین روز برای شروع است.',
            'یه قدم در روز، ۳۶۵ قدم در سال.',
            'مسیر سخت است، ولی تو از مسیر قوی‌تری.'
        ];

        let state = {
            habits: [],
            completed: {},
            currentQuote: 0
        };

        function saveState() {
            localStorage.setItem('masira_state', JSON.stringify({
                habits: state.habits,
                completed: state.completed,
                currentQuote: state.currentQuote,
                date: getTodayKey()
            }));
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('masira_state');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.date === getTodayKey()) {
                        state.habits = data.habits || defaultHabits;
                        state.completed = data.completed || {};
                        state.currentQuote = data.currentQuote || 0;
                        return;
                    }
                }
            } catch (e) {}
            state.habits = defaultHabits;
            state.completed = {};
            state.currentQuote = 0;
        }

        function getTodayKey() {
            const now = new Date();
            return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            timeline.querySelectorAll('.step').forEach(el => el.remove());

            state.habits.forEach((habit, index) => {
                const isDone = state.completed[habit.id];
                const isCurrent = !isDone && isPreviousDone(index);

                const step = document.createElement('div');
                step.className = 'step';
                step.innerHTML = `
                    <div class="step-circle ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}" 
                         onclick="toggleHabit(${habit.id})">
                        ${habit.emoji}
                    </div>
                    <div class="step-label ${isDone || isCurrent ? 'active' : ''}">${habit.label}</div>
                    <div class="step-time ${isCurrent ? 'gold' : ''}">${habit.time}</div>
                `;
                timeline.appendChild(step);
            });

            updateAll();
        }

        function isPreviousDone(index) {
            if (index === 0) return true;
            for (let i = 0; i < index; i++) {
                if (!state.completed[state.habits[i].id]) return false;
            }
            return true;
        }

        function toggleHabit(id) {
            const habit = state.habits.find(h => h.id === id);
            if (!habit) return;

            if (state.completed[id]) {
                delete state.completed[id];
                showToast(`⏪ ${habit.label} برگشت`);
            } else {
                state.completed[id] = true;
                showToast(`✅ ${habit.label} انجام شد!`);
            }

            saveState();
            renderTimeline();
        }

        function updateAll() {
            const total = state.habits.length;
            const done = Object.keys(state.completed).length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = toPersian(percent) + '٪';
            document.getElementById('timelineFill').style.width = percent + '%';
            document.getElementById('sectionCounter').innerHTML =
                `${toPersian(done)} از ${toPersian(total)} <span class="dot"></span>`;

            const nextHabit = state.habits.find(h => !state.completed[h.id]);
            if (nextHabit) {
                document.getElementById('nextStepValue').textContent = `${nextHabit.time} ${nextHabit.label}`;
            } else {
                document.getElementById('nextStepValue').textContent = '🎉 همه انجام شد!';
            }
        }

        function toPersian(num) {
            const persianDigits = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
            return num.toString().replace(/\d/g, d => persianDigits[d]);
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function continuePath() {
            const nextHabit = state.habits.find(h => !state.completed[h.id]);
            if (nextHabit) {
                showToast(`🎯 بریم برای ${nextHabit.label}`);
                toggleHabit(nextHabit.id);
            } else {
                showToast('🎉 امروز همه کارها انجام شد!');
            }
        }

        function addNew() {
            showToast('✨ افزودن عادت جدید (به‌زودی)');
        }

        function rotateQuote() {
            state.currentQuote = (state.currentQuote + 1) % quotes.length;
            document.getElementById('quoteText').innerHTML =
                quotes[state.currentQuote].replace(/\n/g, '<br>');
            saveState();
        }

        function updateGreeting() {
            const hour = new Date().getHours();
            let greeting = 'سلام امیر';
            if (hour < 12) greeting = 'صبح بخیر امیر ☀️';
            else if (hour < 17) greeting = 'ظهر بخیر امیر 🌤️';
            else if (hour < 21) greeting = 'عصر بخیر امیر 🌆';
            else greeting = 'شب بخیر امیر 🌙';
            document.getElementById('greetingHello').textContent = greeting;
        }

        window.addEventListener('load', () => {
            loadState();
            updateGreeting();
            renderTimeline();
            document.getElementById('quoteText').innerHTML =
                quotes[state.currentQuote].replace(/\n/g, '<br>');
            setInterval(rotateQuote, 10000);
        });

        window.addEventListener('beforeunload', saveState);
    </script>
</body>
</html>
