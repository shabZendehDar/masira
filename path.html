<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0F0B1F">
    <title>مسیرا — مسیر من</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0F0B1F;
            --card: #1A1333;
            --border: #241B4A;
            --purple: #7C5CFF;
            --purple-light: #A855F7;
            --gold: #FBBF24;
            --green: #22D97F;
            --text: #FFFFFF;
            --text-dim: #A0A0B8;
            --text-muted: #6B6B80;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            padding-bottom: 120px;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), 0 0 40px rgba(251, 191, 36, 0.2); }
            50% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.8), 0 0 60px rgba(251, 191, 36, 0.4); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.05); }
        }

        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* ============================================
           دکمه‌های سه‌بعدی
           ============================================ */
        .btn-3d {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            color: #FFFFFF;
        }

        .btn-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), transparent);
            border-radius: inherit;
            pointer-events: none;
        }

        .btn-3d::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
            pointer-events: none;
        }

        .btn-3d:hover::after {
            left: 100%;
        }

        .btn-3d:active {
            transform: translateY(3px) scale(0.98);
        }

        .btn-purple {
            background: linear-gradient(180deg, #A855F7 0%, #7C5CFF 100%);
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.35),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                0 6px 20px rgba(124, 92, 255, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-purple:active {
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 3px 10px rgba(124, 92, 255, 0.6);
        }

        /* ===== هدر ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .header-title {
            font-size: 18px;
            font-weight: 800;
        }

        .header-spacer {
            width: 44px;
        }

        /* ===== نوار پیشرفت کلی ===== */
        .overall-progress {
            padding: 0 20px 20px;
            animation: fadeInUp 0.5s ease;
        }

        .overall-progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .overall-label {
            font-size: 13px;
            color: var(--text-dim);
            font-weight: 700;
        }

        .overall-percent {
            font-size: 16px;
            font-weight: 900;
            color: var(--gold);
        }

        .overall-bar {
            width: 100%;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .overall-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #A855F7, var(--gold));
            border-radius: 5px;
            width: 43%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* ===== نقشه گاجینو ===== */
        .map-wrapper {
            padding: 20px 0 0;
            position: relative;
        }

        .map-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 40px;
            gap: 0;
        }

        /* هر ردیف مرحله */
        .map-row {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            padding: 8px 0;
        }

        /* دایره مرحله */
        .node {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            user-select: none;
        }

        .node:active {
            transform: scale(0.92);
        }

        /* مرحله تکمیل‌شده */
        .node.done {
            background: linear-gradient(180deg, #A855F7 0%, #7C5CFF 100%);
            border: 3px solid #A855F7;
            color: #FFFFFF;
            box-shadow: 
                inset 0 3px 0 rgba(255, 255, 255, 0.35),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2),
                0 6px 20px rgba(124, 92, 255, 0.5);
        }

        .node.done::after {
            content: '✓';
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 28px;
            height: 28px;
            background: linear-gradient(180deg, #FCD34D, #FBBF24);
            color: var(--bg);
            border-radius: 50%;
            font-size: 15px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--bg);
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.6);
        }

        /* مرحله فعلی */
        .node.current {
            background: linear-gradient(180deg, #2A1F4A 0%, #1A1333 100%);
            border: 4px solid var(--gold);
            color: var(--gold);
            animation: glow 2s infinite, bounce 3s infinite;
            transform: scale(1.1);
        }

        .node.current::before {
            content: '👉';
            position: absolute;
            top: -32px;
            font-size: 22px;
            animation: bounce 1.5s infinite;
        }

        /* مرحله قفل */
        .node.locked {
            background: linear-gradient(180deg, #1E1635 0%, #15102A 100%);
            border: 3px solid var(--border);
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* صندوق گنج */
        .node.reward {
            background: linear-gradient(180deg, #FCD34D 0%, #FBBF24 100%);
            border: 3px solid var(--gold);
            color: var(--bg);
            animation: float 3s infinite;
            box-shadow: 
                inset 0 3px 0 rgba(255, 255, 255, 0.5),
                inset 0 -4px 0 rgba(0, 0, 0, 0.2),
                0 8px 24px rgba(251, 191, 36, 0.6);
        }

        .node.reward::after {
            content: '🎁';
            position: absolute;
            font-size: 14px;
            top: 2px;
            right: 2px;
        }

        /* دستاورد */
        .node.achievement {
            background: linear-gradient(180deg, #A855F7 0%, #7C5CFF 100%);
            border: 3px solid var(--gold);
            color: var(--gold);
            box-shadow: 
                inset 0 3px 0 rgba(255, 255, 255, 0.35),
                0 8px 24px rgba(124, 92, 255, 0.6),
                0 0 40px rgba(251, 191, 36, 0.4);
            animation: glow 3s infinite;
        }

        /* خط اتصال بین مراحل */
        .connector {
            width: 6px;
            height: 50px;
            background: var(--border);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .connector.done {
            background: linear-gradient(180deg, #A855F7, var(--gold));
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        .connector.done::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 2s infinite;
            background-size: 100% 200%;
        }

        /* انحراف چپ و راست */
        .map-row.left .node {
            margin-left: 60px;
        }

        .map-row.right .node {
            margin-right: 60px;
        }

        .map-row.center .node {
            margin: 0;
        }

        /* برچسب مرحله */
        .node-label {
            position: absolute;
            bottom: -34px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            white-space: nowrap;
            pointer-events: none;
        }

        .node-label.active {
            color: var(--gold);
            font-weight: 900;
        }

        .node-label.done {
            color: var(--purple-light);
        }

        /* ===== دکمه اقدام ===== */
        .action-section {
            padding: 20px;
            position: sticky;
            bottom: 0;
            background: linear-gradient(180deg, transparent, var(--bg) 30%);
            z-index: 50;
        }

        .action-btn {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            border-radius: 18px;
        }

        /* ===== نوار پایین ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(26, 19, 51, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 14px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            flex: 1;
            position: relative;
            padding: 4px 0;
            transition: color 0.3s;
        }

        .nav-item .nav-icon {
            font-size: 22px;
            transition: transform 0.2s;
        }

        .nav-item:active .nav-icon {
            transform: scale(0.9);
        }

        .nav-item.active {
            color: var(--purple-light);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            width: 20px;
            height: 3px;
            background: var(--gold);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--gold);
        }

        .nav-plus {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(180deg, #A855F7 0%, #7C5CFF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #FFFFFF;
            font-weight: 300;
            margin-top: -20px;
            border: 4px solid var(--bg);
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 3px 0 rgba(255, 255, 255, 0.4),
                inset 0 -4px 0 rgba(0, 0, 0, 0.25),
                0 8px 24px rgba(124, 92, 255, 0.6);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            flex: 0 0 auto;
        }

        .nav-plus::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 20%;
            right: 20%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .nav-plus:active {
            transform: translateY(4px) scale(0.95);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            border: 1px solid var(--gold);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(251, 191, 36, 0.3);
            z-index: 200;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- هدر -->
        <div class="header">
            <button class="back-btn" onclick="goHome()">←</button>
            <div class="header-title">مسیر من</div>
            <div class="header-spacer"></div>
        </div>

        <!-- پیشرفت کلی -->
        <div class="overall-progress">
            <div class="overall-progress-header">
                <div class="overall-label">🎯 بهترین نسخه از خودم</div>
                <div class="overall-percent" id="overallPercent">۴۳٪</div>
            </div>
            <div class="overall-bar">
                <div class="overall-bar-fill" id="overallFill"></div>
            </div>
        </div>

        <!-- نقشه مسیر -->
        <div class="map-wrapper">
            <div class="map-container" id="mapContainer"></div>
        </div>

        <!-- دکمه اقدام -->
        <div class="action-section">
            <button class="btn-3d btn-purple action-btn" onclick="startCurrentNode()">
                شروع مرحله فعلی
                <span>⚡</span>
            </button>
        </div>

    </div>

    <!-- نوار پایین -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="goHome()">
            <span class="nav-icon">🏠</span>
            <span>خانه</span>
        </button>
        <button class="nav-item active">
            <span class="nav-icon">🎯</span>
            <span>مسیر</span>
        </button>
        <button class="nav-plus" onclick="goAdd()">+</button>
        <button class="nav-item" onclick="goHabits()">
            <span class="nav-icon">🌱</span>
            <span>عادت روزانه</span>
        </button>
        <button class="nav-item" onclick="goProfile()">
            <span class="nav-icon">👤</span>
            <span>حساب</span>
        </button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== مراحل مسیر =====
        const nodes = [
            { id: 1, type: 'done', emoji: '🌱', label: 'شروع مسیر', position: 'center' },
            { id: 2, type: 'done', emoji: '📖', label: 'عادت اول', position: 'left' },
            { id: 3, type: 'done', emoji: '💪', label: 'قدرت اراده', position: 'right' },
            { id: 4, type: 'current', emoji: '🎯', label: 'تثبیت عادت‌ها', position: 'center' },
            { id: 5, type: 'locked', emoji: '⚡', label: 'انرژی بی‌پایان', position: 'left' },
            { id: 6, type: 'reward', emoji: '🎁', label: 'صندوق گنج', position: 'right' },
            { id: 7, type: 'locked', emoji: '🔥', label: 'استریک طلایی', position: 'center' },
            { id: 8, type: 'locked', emoji: '💎', label: 'گوهر درخشان', position: 'left' },
            { id: 9, type: 'locked', emoji: '👑', label: 'پادشاه مسیر', position: 'right' },
            { id: 10, type: 'achievement', emoji: '🏆', label: 'دستاورد بزرگ', position: 'center' }
        ];

        // ===== ساخت نقشه =====
        function renderMap() {
            const container = document.getElementById('mapContainer');
            container.innerHTML = '';

            nodes.forEach((node, index) => {
                // ردیف مرحله
                const row = document.createElement('div');
                row.className = `map-row ${node.position}`;

                // کلاس دایره
                let nodeClass = 'node';
                let labelClass = 'node-label';

                if (node.type === 'done') {
                    nodeClass += ' done';
                    labelClass += ' done';
                } else if (node.type === 'current') {
                    nodeClass += ' current';
                    labelClass += ' active';
                } else if (node.type === 'locked') {
                    nodeClass += ' locked';
                } else if (node.type === 'reward') {
                    nodeClass += ' reward';
                } else if (node.type === 'achievement') {
                    nodeClass += ' achievement';
                }

                // محتوای دایره
                let content = node.emoji;
                if (node.type === 'locked') {
                    content = '🔒';
                } else if (node.type === 'reward') {
                    content = '🎁';
                } else if (node.type === 'achievement') {
                    content = '🏆';
                } else if (node.type === 'done') {
                    content = '✓';
                } else if (node.type === 'current') {
                    content = node.emoji;
                } else {
                    content = node.emoji;
                }

                // دایره
                const nodeEl = document.createElement('div');
                nodeEl.className = nodeClass;
                nodeEl.textContent = content;
                nodeEl.onclick = () => handleNodeClick(node);

                // برچسب
                const labelEl = document.createElement('div');
                labelEl.className = labelClass;
                labelEl.textContent = node.label;

                nodeEl.appendChild(labelEl);
                row.appendChild(nodeEl);
                container.appendChild(row);

                // خط اتصال (به جز آخرین)
                if (index < nodes.length - 1) {
                    const nextNode = nodes[index + 1];
                    const connector = document.createElement('div');
                    connector.className = 'connector';
                    if (node.type === 'done' && nextNode.type !== 'locked') {
                        connector.classList.add('done');
                    }
                    container.appendChild(connector);
                }
            });
        }

        // ===== کلیک روی مرحله =====
        function handleNodeClick(node) {
            if (node.type === 'locked') {
                showToast(`🔒 ${node.label} — قفله`);
                return;
            }
            if (node.type === 'done') {
                showToast(`✅ ${node.label} — انجام شد`);
                return;
            }
            if (node.type === 'current') {
                showToast(`🎯 بریم برای ${node.label}!`);
                return;
            }
            if (node.type === 'reward') {
                showToast(`🎁 صندوق گنج رو باز کن!`);
                return;
            }
            if (node.type === 'achievement') {
                showToast(`🏆 دستاورد بزرگ`);
                return;
            }
        }

        // ===== شروع مرحله فعلی =====
        function startCurrentNode() {
            const current = nodes.find(n => n.type === 'current');
            if (current) {
                showToast(`⚡ شروع ${current.label}!`);
            } else {
                showToast('🎉 همه مراحل انجام شد!');
            }
        }

        // ===== ناوبری =====
        function goHome() {
            window.location.href = 'index.html';
        }

        function goAdd() {
            window.location.href = 'add-habit.html';
        }

        function goHabits() {
            showToast('🌱 عادت روزانه (به‌زودی)');
        }

        function goProfile() {
            window.location.href = 'profile.html';
        }

        // ===== Toast =====
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ===== راه‌اندازی =====
        window.addEventListener('load', () => {
            renderMap();
        });
    </script>
</body>
</html>
